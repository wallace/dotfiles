###########################
##  Configuration
############################

# use vim key bindings
setw -g mode-keys vi

# make vim work better in tmux
# from http://stackoverflow.com/questions/12312178/tmux-and-vim-escape-key-being-seen-as-and-having-long-delay
set -s escape-time 0

# Set scrollback
set -g history-limit 15000

# TERM inside tmux. screen-256color is the old default from the iTerm days and
# caps tmux at 256 colours, so the hex accents below get approximated to the
# nearest palette entry. tmux-256color carries the truecolor and italics
# entries -- but macOS ships an ncurses whose terminfo database often has no
# tmux-256color, and setting a TERM with no terminfo entry breaks tmux
# outright. So probe for it and fall back rather than assume.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
  'set -g default-terminal "tmux-256color"' \
  'set -g default-terminal "screen-256color"'

# Advertise 24-bit colour to the outer terminal (kitty, always). Without this
# tmux quantises #rrggbb styles down to 256 colours.
set -ga terminal-overrides ",*:RGB"

# decrease command delay (increases vim responsiveness)
# (in milliseconds)
set -sg escape-time 1

# re-number windows when one is closed
set -g renumber-windows on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# tmux prefix is now ctrl-' '
unbind C-b
set -g prefix C-Space

# ###########################
# #  Key Bindings
# ###########################

# Setup 'v' to begin selection as in Vim
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
# 'y' copies to the system clipboard; the command differs per OS, so it is
# bound in .tmux-macos.conf / .tmux-linux.conf (sourced further down, just
# above the status bar).

# Update default binding of `Enter` to also use copy-pipe
# unbind -t vi-copy Enter
# bind -t vi-copy Enter copy-pipe "reattach-to-user-namespace pbcopy"

## Join windows: <prefix> s, <prefix> j
bind-key          S choose-window "join-pane -v -s "%%""
bind-key          V choose-window "join-pane -h -s "%%""
bind-key          B "break-pane"

# Allow tmux to send pane navigation keys to vim when using vim
# This allows us to use same keys for navigating in vim as tmux
is_vim='echo "#{pane_current_command}" | grep -iqE "(^|\/)g?(view|n?vim?)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
#bind -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# Moving among panes
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resizing panes
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# prefix-| splits vertically
# prefix-- splits horizontally
bind | split-window -h
bind - split-window -v

# Reload .tmux.conf with prefix-r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Name each window after the Claude Code session running in it, so the status
# bar reads "1 settleup  2 sys-health" instead of three windows called claude.
# Every live claude writes ~/.claude/sessions/<pid>.json carrying its name and
# the pane it occupies; claude-tmux-name reads those and renames the window
# around each pane. Claude does set the pane title itself, but that only shows
# with pane-border-status on, whereas window-status-format below renders #W.
# Claude hooks (see ~/.claude/settings.json) already run it around every turn,
# so prefix-N is only for picking up a /rename right away rather than at the
# next prompt.
bind N run-shell '~/bin/claude-tmux-name --all'

# Per-OS settings, sourced before the status bar below because they set
# @accent, which the status-* lines interpolate. tmux evaluates this file top
# to bottom, so a source at the end would leave @accent empty. This also
# carries the per-OS clipboard binding for copy-mode 'y'.
if-shell 'test "$(uname)" = "Darwin"' 'source ~/.tmux-macos.conf' 'source ~/.tmux-linux.conf'

# set color of active pane
set -g pane-border-style 'fg=colour237,bg=black'
set -g pane-active-border-style fg=blue,bg=black

# Show pane titles on the border. Claude Code titles its own pane: the session
# name once you set one with /rename, a summary of the conversation while the
# name is still auto-derived ("Tmux session name syncing" for a session called
# jrw-9c). So the window says which claude and the border says what it is
# working on until you name it. Costs one row per window even
# when there is a single pane; the alternative is a pair of after-split-window
# / pane-exited hooks flipping it per window, which is more machinery than the
# row is worth.
set -g pane-border-status top

# The accent below is #{@accent}, set per-OS in .tmux-macos.conf /
# .tmux-linux.conf. Since tmux is never nested here, exactly one status bar is
# ever on screen and its colour is the machine you are typing on.
#
# Bar palette is Solarized dark, chosen to match the Solarized Light terminal
# theme: #002b36 (base03) is the bar itself, #073642 (base02) the raised
# segments -- current window and clock -- and #eee8d5 (base2) the text. The
# previous Tomorrow Night greys put #b2b2b2 text on a #444444 bar and left the
# two window-name blocks one shade apart, which is why nothing separated.
set -g status-style 'bg=#002b36,none'
set -g message-command-style 'fg=#eee8d5,bg=#073642'
set -g status-justify "left"
set -g status-left-length "100"
set -g status "on"
set -g pane-active-border-style 'fg=colour117'
set -g message-style 'fg=#eee8d5,bg=#073642'
set -g status-right-length "100"
set -g status-right-style "none"
setw -g window-status-style "fg=#eee8d5,bg=#002b36,none"
setw -g window-status-activity-style 'bg=#002b36,fg=#2aa198,none'
setw -g window-status-separator ""
set -g status-left "#[fg=#002b36,bg=#{@accent}] #S #[fg=#{@accent},bg=#002b36,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#073642,bg=#002b36,nobold,nounderscore,noitalics]#[fg=#eee8d5,bg=#073642] %Y-%m-%d %H:%M #[fg=#{@accent},bg=#073642,nobold,nounderscore,noitalics]#[fg=#002b36,bg=#{@accent}] #h"
# @wname is what the window blocks below print. Claude and Copilot keep their
# pane titles live, so the bar tracks /rename immediately instead of waiting
# for the actual window name to catch up. Other panes fall back to #W.
set -g @wname "#{?#{m:✳*,#{pane_title}},#{=/20/…:#{s/^✳ //:pane_title}},#{?#{m:* - GitHub Copilot,#{pane_title}},#{=/20/…:#{s/ - GitHub Copilot$//:pane_title}},#W}}"
setw -g window-status-format "#[fg=#eee8d5,bg=#002b36] #I#[fg=#eee8d5,bg=#00323e] #{E:@wname} #F"
setw -g window-status-current-format "#[fg=#002b36,bg=#073642,nobold,nounderscore,noitalics]#[fg=#2aa198,bg=#073642] #I#[fg=#{@accent},bg=#073642] #{E:@wname} #F #[fg=#073642,bg=#002b36,nobold,nounderscore,noitalics]"
