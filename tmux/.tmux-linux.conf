# Linux-specific tmux settings. Sourced from the last line of .tmux.conf.
# reattach-to-user-namespace is macOS-only and must not appear here.

set -g mouse on

# Copy to the X/Wayland clipboard. Requires xclip (X11) or wl-clipboard
# (Wayland): sudo apt install xclip
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe "xclip -selection clipboard -in"
