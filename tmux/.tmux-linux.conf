# Linux-specific tmux settings. Sourced from the last line of .tmux.conf.
# reattach-to-user-namespace is macOS-only and must not appear here.

set -g mouse on

# Copy to the system clipboard. xclip only talks to an X server, so under a
# Wayland session it either fails outright or reaches XWayland's clipboard,
# which native Wayland apps never read -- 'y' then looks like it worked while
# nothing pastes anywhere. Probe for the tool rather than for the session type:
# picking on $XDG_SESSION_TYPE misses the case where tmux was started from a
# context that does not carry it (ssh, a systemd unit, a detached session that
# outlived the login). wl-clipboard for Wayland, xclip as the X11 fallback:
# sudo apt install wl-clipboard
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  "bind-key -Tcopy-mode-vi 'y' send -X copy-pipe 'wl-copy'" \
  "bind-key -Tcopy-mode-vi 'y' send -X copy-pipe 'xclip -selection clipboard -in'"

# Status-bar accent for this machine, interpolated by the status-* lines in
# .tmux.conf as #{@accent}. Bright lime, deliberately louder than the muted
# Tomorrow Night green it replaces -- it sits on the dark Solarized base03 bar,
# which can carry a saturated accent without glare. Matched in loudness to the
# Mac's blue and far from it in hue, so a glance at the bar tells you which
# machine you are typing on.
set -g @accent "#a6e22e"
