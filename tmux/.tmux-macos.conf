# from setting up tmux and vim on mac os x
# http://stackoverflow.com/a/33336609
set -g mouse on

# using pbpaste and pbcopy in tmux
# https://github.com/ChrisJohnsen/tmux-MacOSX-pasteboard
set-option -g default-command "reattach-to-user-namespace -l ${SHELL}"

# Set the default shell as not having this caused problems in sharing clipboard
# with nvim. From https://stackoverflow.com/questions/39645253/clipboard-failure-in-tmux-vim-after-upgrading-to-macos-sierra
set -g default-shell $SHELL
set -g default-command "reattach-to-user-namespace -l ${SHELL}"

# Copy to the macOS pasteboard. reattach-to-user-namespace is required so the
# pbcopy in a tmux pane can reach the real pasteboard (Brewfile installs it
# under `if OS.mac?`).
bind-key -Tcopy-mode-vi 'y' send -X copy-pipe "reattach-to-user-namespace pbcopy"

# Status-bar accent for this machine, interpolated by the status-* lines in
# .tmux.conf as #{@accent}. Bright blue, matched in loudness to the Linux
# box's lime and sitting on the same Solarized base03 bar. Far enough from that
# green in hue to register in peripheral vision.
set -g @accent "#2ea8ff"
