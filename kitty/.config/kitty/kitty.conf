# vim:fileencoding=utf-8:foldmethod=marker
#
# kitty configuration.
#
# This file was previously the full 2,659-line annotated reference dump that
# kitty ships, wrapping five actual settings. The reference lives at
# https://sw.kovidgoyal.net/kitty/conf/ and the original dump is recoverable
# from git history if it is ever wanted back:
#
#     git show 72e3fe2:kitty/.config/kitty/kitty.conf
#
# What follows is only what we set.

# Theme. Managed by `kitten themes`, which rewrites everything between the
# BEGIN/END markers -- do not hand-edit inside them. current-theme.conf is
# generated per machine and is not tracked in this repo, so run `kitten themes`
# once on any new machine or this include warns at startup.
# BEGIN_KITTY_THEME
# Solarized Light
include current-theme.conf
# END_KITTY_THEME

# Bell and notification behaviour, so Copilot CLI and Claude Code permission
# prompts are noticeable when kitty does not have focus.
enable_audio_bell    yes
visual_bell_duration 0.15
visual_bell_color    red
window_alert_on_bell yes

# Per-OS settings. Last, so they override the theme included above.
#
# ${KITTY_OS} is expanded by kitty's own config parser, NOT by the shell --
# which is why `echo $KITTY_OS` inside a kitty window is always empty on every
# version, working or not. It is one of: linux, macos, bsd.
#
# There is deliberately no bsd.conf. A missing include is a startup warning
# rather than an error, and we will never run kitty on a BSD.
include ${KITTY_OS}.conf
